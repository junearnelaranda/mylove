<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Surprise | For Shairyl</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .surprise-container {
            text-align: center;
            animation: zoomIn 1s ease-out;
        }
        .big-heart {
            font-size: 8rem;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
            margin-bottom: 20px;
        }
        .big-heart:hover {
            transform: scale(1.2);
        }
        .surprise-text {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--dark-pink);
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
        }
        .surprise-text.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .back-link {
            margin-top: 40px;
            display: inline-block;
            color: var(--dark-pink);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: 0.3s;
        }
        .back-link:hover {
            opacity: 1;
            text-decoration: underline;
        }
        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: var(--dark-pink);
            position: absolute;
            top: -10px;
            z-index: 0;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }
        
        /* New Media Popper Styles */
        .media-popper-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            overflow: hidden;
        }
        .popped-media {
            position: absolute;
            max-width: 250px;
            max-height: 250px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 5px solid white;
            opacity: 0;
            transform: scale(0.5) rotate(random(-10, 10));
            transition: opacity 1s ease, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .popped-media.visible {
            opacity: 1;
            transform: scale(1) rotate(5deg);
        }

        /* Dropping Media Styles */
        .dropped-media {
            position: absolute;
            max-width: 120px;
            max-height: 120px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border: 3px solid white;
            z-index: 4;
            pointer-events: none;
            animation: dropMedia linear forwards;
        }

        @keyframes dropMedia {
            0% {
                transform: translateY(-150px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .popped-media {
                max-width: 150px;
                max-height: 150px;
            }
        }
    </style>
</head>
<body class="surprise-page">
    <button class="theme-toggle" id="themeToggle" title="Toggle Theme">🌙</button>
    <div class="background-hearts" id="hearts-container"></div>

    <div class="container surprise-container">
        <div class="glass-card">
            <div class="big-heart" id="bigHeart">💝</div>
            <h1 class="surprise-text" id="revealText">You are my Greatest Adventure!</h1>
            <p class="subtitle" id="subText" style="opacity: 0;">I love you more than words can say, Shairyl. </p>
            
            <a href="index.html" class="back-link">← Go back to our letter</a>
        </div>
    </div>

    <!-- Media Popper Container -->
    <div id="mediaPopper" class="media-popper-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bigHeart = document.getElementById('bigHeart');
            const revealText = document.getElementById('revealText');
            const subText = document.getElementById('subText');
            const heartsContainer = document.getElementById('hearts-container');
            const themeToggle = document.getElementById('themeToggle');
            const mediaPopper = document.getElementById('mediaPopper');

            // --- ADD YOUR MEDIA LINKS HERE ---
            const mediaList = [
                { type: 'image', url: 'img&vid/bdayJ.jpeg' },
                { type: 'video', url: 'img&vid/bdayS.mp4' },
                { type: 'video', url: 'img&vid/black.mp4' },
                { type: 'image', url: 'img&vid/coffee.jpeg' },
                { type: 'image', url: 'img&vid/comfy.jpeg' },
                { type: 'image', url: 'img&vid/cut3.jpeg' },
                { type: 'image', url: 'img&vid/cut32.jpeg' },
                { type: 'video', url: 'img&vid/dagats.mp4' },
                { type: 'image', url: 'img&vid/damn.jpeg' },
                { type: 'image', url: 'img&vid/flower.jpeg' },
                { type: 'image', url: 'img&vid/love.jpeg' },
                { type: 'video', url: 'img&vid/white.mp4' },
                { type: 'image', url: 'img&vid/whitey.jpeg' },
                { type: 'image', url: 'img&vid/wild.jpeg' },
                { type: 'image', url: 'img&vid/wing.jpeg' },
                { type: 'video', url: 'img&vid/wings.mp4' },
                { type: 'image', url: 'img&vid/zoom.jpeg' }
            ];
            // ---------------------------------

            let mediaIndex = 0;
            let popperActive = false;

            // Theme handling
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
                themeToggle.innerHTML = '☀️';
            }

            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark');
                const isDark = document.body.classList.contains('dark');
                themeToggle.innerHTML = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            // Heart Click Event
            bigHeart.addEventListener('click', () => {
                revealText.classList.add('visible');
                subText.style.opacity = '1';
                subText.style.transition = 'opacity 2s ease';
                
                // Create extra confetti/hearts
                for (let i = 0; i < 50; i++) {
                    setTimeout(createConfetti, i * 50);
                }
                
                bigHeart.style.animation = 'pulse 0.5s infinite';

                // Start the Media Popper if not already active
                if (!popperActive && mediaList.length > 0) {
                    popperActive = true;
                    startMediaPopper();
                    startMediaDropper();
                }
            });

            function startMediaDropper() {
                const dropNextMedia = () => {
                    const item = mediaList[Math.floor(Math.random() * mediaList.length)];
                    const element = document.createElement(item.type === 'video' ? 'video' : 'img');
                    
                    element.src = item.url;
                    element.classList.add('dropped-media');
                    
                    if (item.type === 'video') {
                        element.muted = true;
                        element.loop = true;
                        element.autoplay = true;
                        element.playsInline = true;
                        element.preload = 'metadata';
                        element.setAttribute('playsinline', '');
                    }

                    // Random horizontal position and speed
                    const x = Math.random() * 90; // 0% to 90%
                    const duration = Math.random() * 4 + 4; // 4s to 8s
                    
                    element.style.left = `${x}vw`;
                    element.style.animationDuration = `${duration}s`;
                    
                    mediaPopper.appendChild(element);

                    if (item.type === 'video') {
                        element.play().catch(() => {});
                    }

                    // Remove after animation
                    setTimeout(() => element.remove(), duration * 1000);

                    // Trigger next one in 2 seconds
                    setTimeout(dropNextMedia, 2000);
                };

                dropNextMedia();
            }

            function startMediaPopper() {
                const showNextMedia = () => {
                    const item = mediaList[mediaIndex];
                    const element = document.createElement(item.type === 'video' ? 'video' : 'img');
                    
                    element.src = item.url;
                    element.classList.add('popped-media');
                    
                    if (item.type === 'video') {
                        element.muted = true;
                        element.loop = true;
                        element.autoplay = true;
                        element.playsInline = true;
                        element.preload = 'metadata';
                        element.setAttribute('playsinline', '');
                    }

                    // Random scattered position
                    const x = Math.random() * 60 + 10; // 10% to 70%
                    const y = Math.random() * 60 + 10; // 10% to 70%
                    element.style.left = `${x}vw`;
                    element.style.top = `${y}vh`;
                    
                    mediaPopper.appendChild(element);

                    if (item.type === 'video') {
                        element.play().catch(() => {});
                    }

                    // Fade in
                    setTimeout(() => element.classList.add('visible'), 100);

                    // Fade out and remove after 5 seconds
                    setTimeout(() => {
                        element.classList.remove('visible');
                        setTimeout(() => element.remove(), 1000);
                    }, 5000);

                    // Prepare next index
                    mediaIndex = (mediaIndex + 1) % mediaList.length;

                    // Trigger next one in 3 seconds (overlapping effect)
                    setTimeout(showNextMedia, 3000);
                };

                showNextMedia();
            }

            function createConfetti() {
                const colors = ['#ff4b2b', '#ffafbd', '#ffc3a0', '#ffffff'];
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 5000);
            }

            // Background Hearts
            function createHeart() {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                const startX = Math.random() * 100;
                const duration = Math.random() * 3 + 3;
                heart.style.left = `${startX}vw`;
                heart.style.animationDuration = `${duration}s`;
                heartsContainer.appendChild(heart);
                setTimeout(() => heart.remove(), duration * 1000);
            }
            setInterval(createHeart, 300);
        });
    </script>
</body>
</html>
